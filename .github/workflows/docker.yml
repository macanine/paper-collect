name: Docker Build and Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built images to the configured production host
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish images
    runs-on: ubuntu-latest
    outputs:
      app_image: ${{ steps.names.outputs.app_image }}
      rapidocr_image: ${{ steps.names.outputs.rapidocr_image }}
      image_tag: ${{ steps.names.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          app_image="ghcr.io/${repo}"
          rapidocr_image="ghcr.io/${repo}-rapidocr"
          image_tag="sha-${GITHUB_SHA}"
          {
            echo "APP_IMAGE=${app_image}"
            echo "RAPIDOCR_IMAGE=${rapidocr_image}"
          } >> "$GITHUB_ENV"
          {
            echo "app_image=${app_image}"
            echo "rapidocr_image=${rapidocr_image}"
            echo "image_tag=${image_tag}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.app_image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha,scope=paper-collect-app
          cache-to: type=gha,mode=max,scope=paper-collect-app

      - name: RapidOCR image metadata
        id: rapidocr-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.rapidocr_image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push RapidOCR
        uses: docker/build-push-action@v6
        with:
          context: services/rapidocr
          file: services/rapidocr/Dockerfile
          push: true
          tags: ${{ steps.rapidocr-meta.outputs.tags }}
          labels: ${{ steps.rapidocr-meta.outputs.labels }}
          cache-from: type=gha,scope=paper-collect-rapidocr
          cache-to: type=gha,mode=max,scope=paper-collect-rapidocr

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload Compose assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;;
          esac
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$DEPLOY_PATH'"
          tar -C deploy -czf - docker-compose.prod.yml gateway.conf remote-deploy.sh \
            | ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xzf - -C '$DEPLOY_PATH'"

      - name: Log in to GHCR on the deployment host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          : "${GHCR_USERNAME:?GHCR_USERNAME secret is required}"
          : "${GHCR_READ_TOKEN:?GHCR_READ_TOKEN secret is required}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          printf '%s' "$GHCR_READ_TOKEN" \
            | ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pull images and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_IMAGE: ${{ needs.images.outputs.app_image }}
          RAPIDOCR_IMAGE: ${{ needs.images.outputs.rapidocr_image }}
          IMAGE_TAG: ${{ needs.images.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '$DEPLOY_PATH' && chmod 700 remote-deploy.sh && APP_IMAGE='${APP_IMAGE}:${IMAGE_TAG}' RAPIDOCR_IMAGE='${RAPIDOCR_IMAGE}:${IMAGE_TAG}' ./remote-deploy.sh"
