name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test and vet
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/server ./cmd/migrate

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test, typecheck and build
        working-directory: web
        run: |
          npm test
          npm run typecheck
          npm run build

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local and production Compose files
        env:
          APP_IMAGE: ghcr.io/example/paper-collect:sha-test
          RAPIDOCR_IMAGE: ghcr.io/example/paper-collect-rapidocr:sha-test
          ADMIN_PASSWORD: ci-admin-password
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          MASTER_KEY: Y2ktbWFzdGVyLWtleS0zMi1ieXRlcy1sb25nISE=
          POSTGRES_PASSWORD: ci-postgres-password
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.prod.yml config --quiet
