services:
  app-network-proxy:
    image: alpine/socat:1.8.0.0
    restart: unless-stopped
    command: ["TCP-LISTEN:3000,fork,reuseaddr", "TCP:new-api:3000"]
    networks:
      - default
      - new-api

  app-1:
    depends_on:
      app-network-proxy:
        condition: service_started

  app-2:
    depends_on:
      app-network-proxy:
        condition: service_started

networks:
  new-api:
    external: true
    name: ${NEW_API_NETWORK:-new-api_new-api-network}
