# 从端节点。可部署在任意能主动访问主端的机器上（包括 NAT 或家庭宽带之后），
# 不需要数据库、DATA_DIR、JWT_SECRET 或 MASTER_KEY。
#
#   MASTER_URL=https://paper.example.com NODE_TOKEN=nd-... \
#     docker compose -f deploy/docker-compose.worker.yml up -d
name: paper-collect-worker

services:
  worker:
    image: "${APP_IMAGE:-paper-collect:local}"
    restart: unless-stopped
    environment:
      ROLE: worker
      MASTER_URL: "${MASTER_URL:?请设置主端地址，非本机地址必须是 https}"
      NODE_TOKEN: "${NODE_TOKEN:?请设置在主端「节点」页面创建的令牌}"
      CACHE_DIR: /app/cache
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - worker-cache:/app/cache
    stop_grace_period: 40s

volumes:
  worker-cache:
